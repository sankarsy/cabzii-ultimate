# Request Google indexing for public URLs after every push to GitHub.
name: Google indexing

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: google-index
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notify-google:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Request Google indexing
        env:
          SITE_URL: https://www.cabzii.in
          GOOGLE_INDEXING_SA_JSON: ${{ secrets.GOOGLE_INDEXING_SA_JSON }}
          GSC_CLIENT_EMAIL: ${{ secrets.GSC_CLIENT_EMAIL }}
          GSC_PRIVATE_KEY: ${{ secrets.GSC_PRIVATE_KEY }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/google-index-on-push.mjs
